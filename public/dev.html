<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Developer Console</title>
<style>
:root{--a:#19e6ff;--b:#ff9d1a;--bg:#070b14;--p:#0d1424;--l:rgba(120,170,255,.18);--t:#e6efff;--m:#8a9bb8;--r:#ff4d6d;--g:#8ff0c3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:#060a13;border:1px solid var(--l);padding:6px 8px;border-radius:4px;max-width:100%}input:focus,select:focus,textarea:focus{outline:1px solid var(--a)}
input[type=number]{width:92px}input[type=color]{padding:0;width:40px;height:30px}input[type=checkbox]{width:auto}
button{background:#13203a;border:1px solid var(--l);padding:7px 14px;border-radius:4px;cursor:pointer}button:hover{background:#1b2d52}button.pri{background:var(--a);color:#04101a;font-weight:700;border:0}button.dan{color:var(--r)}button.sm{padding:3px 9px;font-size:13px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}#login h1{margin:0;letter-spacing:.2em;font-size:20px}#login input{font-size:28px;text-align:center;letter-spacing:.5em;width:220px}
#err{color:var(--r);min-height:20px}
#app{display:none}header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--p);border-bottom:1px solid var(--l);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header b{letter-spacing:.15em}header .sp{flex:1}.dirty{color:var(--b);font-weight:700}
nav{display:flex;gap:2px;padding:8px 16px 0;flex-wrap:wrap;border-bottom:1px solid var(--l);background:#0a1020}nav button{border-radius:4px 4px 0 0;border-bottom:0;background:transparent}nav button.on{background:var(--p);color:var(--a);border-color:var(--a)}
main{padding:16px;max-width:1200px;margin:0 auto}section.tab{display:none}section.tab.on{display:block}
.card{background:var(--p);border:1px solid var(--l);border-radius:6px;padding:14px;margin-bottom:14px}.card h3{margin:0 0 10px;font-size:14px;letter-spacing:.14em;color:var(--m);text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--m)}.f input,.f select{color:var(--t);font-size:14px}.f.wide{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tag{padding:2px 8px;border-radius:10px;background:#16294a;font-size:12px}.muted{color:var(--m)}
table{width:100%;border-collapse:collapse}td,th{padding:5px 8px;border-bottom:1px solid var(--l);text-align:left;font-size:14px}th{color:var(--m);font-size:12px;letter-spacing:.1em}
.item{border:1px solid var(--l);border-radius:6px;padding:12px;margin-bottom:12px;background:#0a1120}.item>.hd{display:flex;gap:10px;align-items:center;margin-bottom:10px}.item>.hd b{color:var(--a)}
#mapwrap{overflow:auto;border:1px solid var(--l);background:#04070d;max-height:70vh;display:inline-block;max-width:100%}#mapcv{display:block;cursor:crosshair;touch-action:none}
.pal{display:flex;gap:6px;flex-wrap:wrap}.pal button{display:flex;align-items:center;gap:6px}.pal i{width:14px;height:14px;display:inline-block;border:1px solid #fff3}.pal button.on{border-color:var(--a);background:#1b2d52}
.track{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--l)}
textarea#raw{width:100%;height:60vh;font:13px/1.35 ui-monospace,Menlo,monospace}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0d1424;border:1px solid var(--a);padding:10px 18px;border-radius:6px;z-index:20;display:none}#toast.bad{border-color:var(--r)}
.warn{background:#3a2208;border:1px solid var(--b);padding:10px 14px;border-radius:6px;margin-bottom:14px;color:#ffd9a3}
</style></head><body>
<div id="login"><h1>VECTOR: BLACKOUT · DEVELOPER</h1><input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off" maxlength="32"><button class="pri" id="go">ENTER</button><div id="err"></div></div>
<div id="app">
<header><b>DEV CONSOLE</b><span class="muted" id="hs"></span><span class="sp"></span><span id="dirty" class="dirty"></span><button class="pri" id="save">APPLY &amp; PUBLISH LIVE</button><button id="revert">Discard edits</button><button id="out">Sign out</button></header>
<nav id="nav"></nav>
<main>
<section class="tab" id="t-dash"></section>
<section class="tab" id="t-bal"></section>
<section class="tab" id="t-maps"></section>
<section class="tab" id="t-brand"></section>
<section class="tab" id="t-music"></section>
<section class="tab" id="t-raw"></section>
</main></div>
<div id="toast"></div>
<script src="js/dev.js"></script>
</body></html>
