services:
  - type: web
    name: vector-blackout
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: DEV_PIN
        sync: false
      - key: DATA_DIR
        value: /data
    disk:
      name: vb-data
      mountPath: /data
      sizeGB: 1
